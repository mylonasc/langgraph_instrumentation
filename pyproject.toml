[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "langgraph-instrumentation"
version = "0.1.0"
description = "Modular tracing and observability instrumentation for LangGraph agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.1.0",
]

[project.optional-dependencies]
examples = [
    "langchain-ollama>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.3",
    "python-dotenv>=1.0.0",
]
otlp = [
    "opentelemetry-api>=1.38.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.0",
    "ty>=0.0.1a21",
]

# Keep this repository self-contained even when cloned below another uv workspace.
[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["langgraph_instrumentation"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
exclude = ["src/langgraph_instrumentation/instrumentation.py"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["src/langgraph_instrumentation", "tests"]
exclude = ["src/langgraph_instrumentation/instrumentation.py"]
